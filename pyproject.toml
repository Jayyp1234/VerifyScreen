[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifyscreen"
version = "0.1.0"
description = "Vendor integrity screening: catch front companies before the contract is awarded."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Okeke Johnpaul Ebubechukwu", email = "okekejohnpaul12@gmail.com" }]
keywords = [
    "local content",
    "procurement",
    "vendor screening",
    "fraud detection",
    "oil and gas",
    "nigeria",
    "compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.0"]
research = ["scikit-learn>=1.0", "numpy>=1.21", "matplotlib>=3.5"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Jayyp1234/VerifyScreen"
Demo = "https://jayyp1234.github.io/VerifyScreen/"
Source = "https://github.com/Jayyp1234/VerifyScreen"
Issues = "https://github.com/Jayyp1234/VerifyScreen/issues"

[project.scripts]
verifyscreen = "verifyscreen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["verifyscreen"]

[tool.hatch.build.targets.sdist]
include = ["verifyscreen", "tests", "models", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
